
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Inventario Escolar</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fa;
color:#263238
}

button,input,select{font-family:inherit}
button{cursor:pointer}
.oculto{display:none!important}
.sistema{display:flex;min-height:100vh}

/* MENU */
.menu-lateral{
width:270px;
min-height:100vh;
background:#fff;
border-right:1px solid #dfe4e8;
position:fixed;
left:0;
top:0;
padding:20px 15px;
z-index:10000;
transform:translateX(-100%);
transition:.3s;
box-shadow:3px 0 15px rgba(0,0,0,.06);
}

.menu-lateral.menu-abierto{
transform:translateX(0);
}

.logo-instituto{
width:55px;
height:55px;
object-fit:contain;
border-radius:8px;
display:block;
margin:0 auto;
}

.nombre-logo{
display:flex;
flex-direction:column;
line-height:1.2;
text-align:center;
width:100%;
}

.nombre-logo strong{
color:#174ea6;
font-size:19px
}

.nombre-logo span{
color:#555;
font-size:16px;
margin-top:3px
}

.menu{
display:flex;
flex-direction:column;
gap:6px;
}

.menu-item{
width:100%;
min-height:50px;
border:0;
background:transparent;
display:flex;
align-items:center;
gap:12px;
padding:10px 12px;
border-radius:9px;
color:#56616b;
font-size:15px;
text-align:left;
text-decoration:none;
}

.menu-item:hover,
.menu-item.activo{
background:#e5efff;
color:#174ea6;
text-decoration:none;
}

.menu-item.activo{
font-weight:bold;
}

.icono-menu{
width:27px;
text-align:center;
font-size:20px;
}

.panel-icon{color:#3975c9}
.catalogo-icon{color:#4567b7}
.alerta-icon{color:#e19a24}
.entrada-icon{color:#159447}
.salida-icon{color:#176dcc}
.config-icon{color:#737d86}

.contador-menu{
margin-left:auto;
min-width:27px;
height:27px;
display:flex;
align-items:center;
justify-content:center;
background:#d85b70;
color:white;
border-radius:50%;
font-size:12px;
font-weight:bold;
}

.cerrar-sesion{
position:absolute;
bottom:22px;
left:15px;
width:calc(100% - 30px);
border:0;
background:transparent;
display:flex;
align-items:center;
gap:10px;
padding:11px 14px;
color:#d16b76;
font-size:14px;
text-align:left;
}

.cerrar-sesion:hover{
background:#fff1f2;
border-radius:8px;
}

/* CONTENIDO */
.contenido{
width:100%;
min-height:100vh;
transition:.3s;
}

.contenido.menu-desplazado{
margin-left:270px;
width:calc(100% - 270px);
}

.cabecera{
min-height:110px;
background:#fff;
border-bottom:1px solid #dfe4e8;
display:flex;
align-items:center;
padding:20px 40px;
}

.btn-hamburguesa{
width:48px;
height:48px;
border:0;
border-radius:9px;
background:#174ea6;
color:#fff;
font-size:27px;
display:flex;
align-items:center;
justify-content:center;
position:fixed;
top:20px;
left:15px;
margin:0;
z-index:30000;
box-shadow:0 4px 12px #0003;
}

.btn-hamburguesa:hover{
background:#123d82;
}

.titulo{
position:absolute;
left:50%;
transform:translateX(-50%);
text-align:center;
min-width:0;
white-space:nowrap;
}

.titulo h1{
font-size:27px;
margin-bottom:6px;
}

.titulo p{
color:#6c757d;
font-size:15px;
}

.usuario{
margin-left:auto;
display:flex;
align-items:center;
gap:9px;
}

/* NOTIFICACIONES */
.notificaciones{
position:relative;
}

.btn-campana{
border:0;
background:transparent;
font-size:22px;
position:relative;
width:42px;
height:42px;
}

.contador-notificaciones{
position:absolute;
top:0;
right:0;
min-width:18px;
height:18px;
padding:2px 5px;
background:#d85b70;
color:#fff;
border-radius:10px;
font-size:11px;
font-weight:bold;
}

.panel-notificaciones{
position:absolute;
top:50px;
right:0;
width:330px;
background:#fff;
border:1px solid #ddd;
border-radius:10px;
box-shadow:0 8px 25px #0002;
z-index:20000;
overflow:hidden;
}

.titulo-notificaciones{
padding:15px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #eee;
}

.titulo-notificaciones span{
color:#888;
font-size:13px;
}

.notificacion-item{
display:flex;
align-items:center;
gap:12px;
padding:15px;
border-bottom:1px solid #eee;
}

.icono-notificacion{
width:38px;
height:38px;
display:flex;
align-items:center;
justify-content:center;
background:#fff0e0;
border-radius:50%;
}

.texto-notificacion{
display:flex;
flex-direction:column;
gap:3px;
}

.texto-notificacion span,
.texto-notificacion small{
color:#777;
font-size:13px;
}

.sin-notificaciones{
padding:25px;
text-align:center;
color:#888;
}

/* ADMIN */
.foto-usuario{
width:40px;
height:40px;
border-radius:50%;
background:#174ea6;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
overflow:hidden;
}

.foto-usuario img{
width:100%;
height:100%;
object-fit:cover;
}

.admin-btn{
border:0;
background:transparent;
display:flex;
align-items:center;
gap:7px;
font-size:15px;
font-weight:bold;
color:#37474f;
}

.flecha{
font-size:18px;
}

.menu-admin{
position:fixed;
top:85px;
right:25px;
width:220px;
background:#fff;
border:1px solid #ddd;
border-radius:10px;
box-shadow:0 8px 25px #0002;
z-index:30000;
overflow:hidden;
}

.menu-admin-header{
padding:12px 15px;
border-bottom:1px solid #eee;
background:#f8fafc;
}

.menu-admin-header strong{
display:block;
font-size:13px;
color:#174ea6;
}

.menu-admin-header span{
display:block;
font-size:12px;
color:#777;
margin-top:3px;
}

.menu-admin button{
width:100%;
padding:13px 15px;
border:0;
background:#fff;
text-align:left;
font-size:14px;
}

.menu-admin button:hover{
background:#f2f5f8;
}

/* CATALOGO */
.catalogo{
padding:32px 40px;
}

.encabezado-modulo{
display:flex;
align-items:center;
gap:12px;
margin-bottom:25px;
}

.encabezado-modulo h2{
font-size:23px;
}

.icono-grande{
font-size:28px;
}

.barra-superior{
display:flex;
align-items:center;
gap:15px;
margin-bottom:25px;
}

.busqueda{
flex:1;
height:46px;
background:#fff;
border:1px solid #ccd3d9;
border-radius:8px;
display:flex;
align-items:center;
padding:0 12px;
}

.lupa{
font-size:22px;
color:#777;
}

.busqueda input{
width:100%;
border:0;
outline:0;
padding:10px;
font-size:14px;
}

.filtro select{
height:46px;
border:1px solid #ccd3d9;
border-radius:8px;
background:#fff;
padding:0 12px;
color:#555;
font-size:14px;
}

.btn-nuevo{
height:46px;
border:0;
border-radius:8px;
background:#174ea6;
color:#fff;
padding:0 18px;
font-weight:bold;
}

.btn-nuevo:hover{
background:#123d82;
}

/* TABLA */
.tabla-contenedor{
background:#fff;
border-radius:12px;
overflow-x:auto;
border:1px solid #d9e0e6;
box-shadow:0 3px 12px #0001;
}

table{
width:100%;
border-collapse:collapse;
min-width:950px;
}

thead{
background:#edf3fa;
}

th{
color:#263f5b;
font-size:14px;
padding:16px 14px;
text-align:left;
border-right:1px solid #d7e0e8;
border-bottom:2px solid #c9d5df;
}

td{
color:#37474f;
font-size:14px;
padding:17px 14px;
border-right:1px solid #e0e5e9;
border-bottom:1px solid #e0e5e9;
}

tbody tr:hover{
background:#f7faff;
}

.nombre-producto{
display:block;
font-weight:bold;
}

.empresa{
display:block;
color:#999;
font-size:12px;
margin-top:4px;
}

.estado{
display:inline-block;
padding:7px 10px;
border-radius:15px;
font-size:12px;
font-weight:bold;
}

.estado.normal{
background:#e3f6ea;
color:#16803c;
}

.estado.bajo{
background:#fff0df;
color:#c47b21;
}

/* BOTON VER */
.btn-detalles{
border:1px solid #c9dcfa;
background:#eaf2ff;
color:#174ea6;
padding:7px 14px;
border-radius:6px;
font-weight:bold;
}

/* BASURERO: SOLO EL ICONO */
.btn-eliminar{
margin-left:5px;
padding:0;
border:none;
background:transparent;
color:#d9534f;
font-size:16px;
cursor:pointer;
box-shadow:none;
outline:none;
display:inline;
vertical-align:middle;
}

.btn-eliminar:hover{
background:transparent;
box-shadow:none;
transform:scale(1.05);
}

/* CARDS */
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:20px;
}

.card{
background:#fff;
border-radius:11px;
padding:22px;
box-shadow:0 3px 10px #0001;
border:1px solid #e1e6ea;
}

.card h3{
margin-bottom:10px;
font-size:17px;
}

.card p{
color:#666;
margin:7px 0;
font-size:14px;
}

.card-numero{
font-size:32px;
font-weight:bold;
color:#174ea6;
margin-top:15px;
}

/* MODALES */
.modal{
position:fixed;
inset:0;
background:#0007;
display:flex;
align-items:center;
justify-content:center;
z-index:50000;
}

.modal-contenido{
width:450px;
max-width:90%;
max-height:90vh;
overflow-y:auto;
background:#fff;
border-radius:12px;
padding:28px;
position:relative;
box-shadow:0 15px 40px #0004;
}

.modal-contenido h2{
margin-bottom:22px;
}

.cerrar-modal{
position:absolute;
top:12px;
right:15px;
border:0;
background:transparent;
font-size:28px;
color:#777;
}

.modal-contenido label{
display:block;
margin:12px 0 6px;
font-weight:bold;
font-size:14px;
}

.modal-contenido input,
.modal-contenido select{
width:100%;
height:42px;
border:1px solid #cfd5da;
border-radius:7px;
padding:8px 10px;
outline:0;
}

.btn-guardar,
.btn-cancelar{
width:100%;
height:43px;
border:0;
border-radius:7px;
font-weight:bold;
}

.btn-guardar{
margin-top:18px;
background:#174ea6;
color:#fff;
}

.btn-cancelar{
margin-top:10px;
background:#eef1f4;
color:#555;
}

/* FONDO */
.fondo-menu{
display:none;
position:fixed;
inset:0;
background:#0006;
z-index:9000;
}

.fondo-menu.fondo-visible{
display:block;
}

/* RESPONSIVE */
@media(max-width:850px){

.cabecera{
padding:20px
}

.catalogo{
padding:25px 20px
}

.titulo h1{
font-size:23px
}

.barra-superior{
flex-wrap:wrap
}

}

@media(max-width:600px){

.cabecera{
min-height:120px;
padding:15px;
align-items:flex-start;
}

.btn-hamburguesa{
width:45px;
height:45px;
font-size:25px;
margin-right:12px;
}

.titulo h1{
font-size:20px
}

.titulo p{
font-size:13px
}

.usuario{
position:absolute;
right:15px;
top:15px;
}

.catalogo{
padding:20px 15px;
}

.barra-superior{
flex-direction:column;
align-items:stretch;
}

.filtro select,
.btn-nuevo{
width:100%;
}

.panel-notificaciones{
right:-100px;
width:290px;
}

}
</style>
</head>

<script>

/* CUENTAS */

let cuentas=[];

try{

cuentas=
JSON.parse(
localStorage.getItem(
"cuentasInventario"
)
)||[];

}catch(error){

cuentas=[];

}

let cuentaActivaId=
localStorage.getItem(
"cuentaActivaInventario"
);

let cuentaEditandoId=null;

let fotoTemporal="";


/* CREAR CUENTA INICIAL */

if(cuentas.length===0){

const cuentaInicial={

id:Date.now().toString(),

nombre:"Admin",

correo:"admin@instituto.com",

rol:"Administrador",

foto:""

};

cuentas.push(
cuentaInicial
);

cuentaActivaId=
cuentaInicial.id;

guardarCuentas();

}


/* COMPROBAR CUENTA ACTIVA */

if(
!cuentaActivaId ||
!cuentas.some(
cuenta=>
cuenta.id===cuentaActivaId
)
){

cuentaActivaId=
cuentas[0].id;

guardarCuentas();

}


/* GUARDAR CUENTAS */

function guardarCuentas(){

localStorage.setItem(
"cuentasInventario",
JSON.stringify(cuentas)
);

localStorage.setItem(
"cuentaActivaInventario",
cuentaActivaId
);

}


/* OBTENER CUENTA ACTIVA */

function obtenerCuentaActiva(){

return cuentas.find(
cuenta=>
cuenta.id===cuentaActivaId
);

}


/* MOSTRAR CUENTA */

function actualizarPerfil(){

const cuenta=
obtenerCuentaActiva();

if(!cuenta)return;

$("navUserNombre")
.textContent=
cuenta.nombre;

$("dropUserNombre")
.textContent=
cuenta.nombre;

$("dropUserCorreo")
.textContent=
cuenta.correo;

$("dropUserRol")
.textContent=
cuenta.rol;

const foto=
$("fotoUsuario");

if(cuenta.foto){

foto.innerHTML=
`<img src="${cuenta.foto}" alt="Foto">`;

}else{

foto.innerHTML="👤";

}

}


/* MI CUENTA */

function abrirMiCuenta(){

const cuenta=
obtenerCuentaActiva();

if(!cuenta)return;

cuentaEditandoId=
cuenta.id;

fotoTemporal=
cuenta.foto||"";

$("tituloModalCuenta")
.textContent=
"Mi cuenta";

$("contenidoCuenta")
.innerHTML=`

<div style="
width:100px;
height:100px;
border-radius:50%;
background:#174ea6;
margin:0 auto 15px;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:40px;
overflow:hidden;
"
id="previewFoto">

${
cuenta.foto
?
`<img src="${cuenta.foto}"
style="width:100%;height:100%;object-fit:cover;">`
:
"👤"
}

</div>

<label>
Nombre
</label>

<input
id="nombreCuenta"
type="text"
value="${escapeHTML(cuenta.nombre)}"
required>

<label>
Correo electrónico
</label>

<input
id="correoCuenta"
type="email"
value="${escapeHTML(cuenta.correo)}"
required>

<label>
Rol
</label>

<select id="rolCuenta">

<option value="Administrador"
${cuenta.rol==="Administrador"?"selected":""}>
Administrador
</option>

<option value="Encargado de inventario"
${cuenta.rol==="Encargado de inventario"?"selected":""}>
Encargado de inventario
</option>

<option value="Consulta"
${cuenta.rol==="Consulta"?"selected":""}>
Consulta
</option>

</select>

<label>
Foto de perfil
</label>

<input
id="fotoCuenta"
type="file"
accept="image/*">

<button
id="guardarPerfil"
class="btn-guardar">

Guardar cambios

</button>

<button

/* PREVISUALIZAR FOTO */

function previsualizarFoto(event){

const archivo=
event.target.files[0];

if(!archivo)return;

const lector=
new FileReader();

lector.onload=function(e){

fotoTemporal=
e.target.result;

mostrarPreview(
fotoTemporal
);

};

lector.readAsDataURL(
archivo
);

}


/* PREVIEW */

function mostrarPreview(foto){

const preview=
$("previewFoto");

if(!preview)return;

if(foto){

preview.innerHTML=
`<img src="${foto}"
style="width:100%;height:100%;object-fit:cover;">`;

}else{

preview.innerHTML="👤";

}

}

if(cuentaEditandoId){

cuentas.find(

);

if(cuenta){

cuenta.nombre=
nombre;

cuenta.correo=
correo;

cuenta.rol=
rol;

cuenta.foto=
fotoTemporal||"";

}

}else{

const nuevaCuenta={

id:
Date.now().toString(),

nombre:
nombre,

correo:
correo,

rol:
rol,

foto:
fotoTemporal||""

actualizarPerfil();

/* ESCAPAR HTML */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

"Ingrese una cantidad válida."
);

if(!fecha)
return alert(
"Seleccione la fecha."
);

let producto=
productos.find(
p=>p.codigo===codigo
);

if(!producto)
return alert(
"No se encontró el producto."
);

producto.cantidad+=cantidad;

entradas.push({

codigo:
producto.codigo,

nombre:
producto.nombre,

cantidad,

unidad:
producto.unidad,

fecha,

observacion

});

guardar();

actualizarAlertas();

mostrarEntradas();

alert(
"✓ Entrada registrada correctamente."
);

}

/* REGISTRAR SALIDA */

function registrarSalida(){

let codigo=
$("productoSalida")
.value;

let cantidad=
Number(
$("cantidadSalida")
.value
);

let fecha=
$("fechaSalida")
.value;

if(!codigo)
return alert(
"Seleccione un producto."
);

if(!cantidad || cantidad<=0)
return alert(
"Ingrese una cantidad válida."
);

if(!fecha)
return alert(
"Seleccione la fecha."
);

let producto=
productos.find(
p=>p.codigo===codigo
);

if(!producto)
return alert(
"No se encontró el producto."
);

if(cantidad>producto.cantidad)
return alert(
"No puede retirar más producto del que existe."
);

producto.cantidad-=cantidad;

salidas.push({

codigo:
producto.codigo,

nombre:
producto.nombre,

cantidad,

unidad:
producto.unidad,

fecha,

motivo:
"Producto vencido"

});

guardar();

actualizarAlertas();

mostrarSalidas();

alert(
"✓ Salida registrada correctamente."
);

}
